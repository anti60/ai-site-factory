<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Expense Tracker Tool</title><style>body { font-family: 'Space Grotesk', sans-serif; background-color: #0A0A0F; color: #FFFFFF; margin: 0; padding: 0; } h1 { text-align: center; color: var(--primary); padding: 20px; } .container { max-width: 800px; margin: auto; padding: 20px; } .form-section { margin: 20px 0; } input, button { padding: 12px; font-size: 16px; border-radius: 5px; border: none; width: 100%; } input { margin-bottom: 15px; } button { background: var(--primary); color: white; cursor: pointer; transition: background 0.3s; } button:hover { background: var(--secondary); } .display-section { margin: 20px 0; padding: 20px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; } .graph { height: 300px; width: 100%; margin: 20px 0; background: rgba(255, 255, 255, 0.2); border-radius: 5px; position: relative; } .bar { height: 100%; text-align: center; color: white; line-height: 2; position: absolute; bottom: 0; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } .fade-in { animation: fadeIn 1s; } :root { --primary: #58a6ff; --secondary: #a78bfa; --accent: #34d399; } @media (max-width: 768px) { .form-section { margin: 10px 0; } input, button { padding: 8px; font-size: 14px; } } @media (min-width: 768px) { .container { padding: 40px; } } </style></head><body><div class="container fade-in"><h1>Expense Tracker Tool</h1><div class="form-section"><input type="text" id="expenseName" placeholder="Expense Name" required/><input type="number" id="expenseAmount" placeholder="Amount" required/><button id="addExpense">Add Expense</button></div><div class="display-section"><h2>Your Expenses</h2><ul id="expenseList"></ul><div class="graph" id="chart"></div></div></div><script>const expenses = [];document.getElementById('addExpense').addEventListener('click', function() { const name = document.getElementById('expenseName').value; const amount = parseFloat(document.getElementById('expenseAmount').value); if(name && !isNaN(amount)) { expenses.push({ name, amount }); document.getElementById('expenseName').value = ''; document.getElementById('expenseAmount').value = ''; updateExpenseList(); } });function updateExpenseList() { const list = document.getElementById('expenseList'); while(list.firstChild) { list.removeChild(list.firstChild); } expenses.forEach(expense => { const li = document.createElement('li'); li.textContent = `${expense.name}: $${expense.amount.toFixed(2)}`; list.appendChild(li); }); renderGraph();}function renderGraph() { const chart = document.getElementById('chart'); chart.innerHTML = ''; let total = 0; expenses.forEach(expense => total += expense.amount); expenses.forEach((expense, index) => { const bar = document.createElement('div'); const percentage = (expense.amount / total) * 100; bar.style.width = percentage + '%'; bar.style.height = '100%'; bar.style.background = 'var(--accent)'; bar.style.position = 'relative'; bar.style.color = 'white'; bar.className = 'bar'; bar.style.bottom = '0'; bar.textContent = `${expense.name}: $${expense.amount.toFixed(2)}`; chart.appendChild(bar); });} </script><a href="https://ai-site-factory-green.vercel.app" id="__back_btn" style="position:fixed;bottom:20px;right:20px;z-index:99999;background:rgba(10,10,15,0.9);backdrop-filter:blur(10px);color:#58a6ff;border:1px solid rgba(88,166,255,0.4);padding:10px 18px;border-radius:50px;font-family:sans-serif;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 4px 20px rgba(0,0,0,0.5);">← AI Site Factory</a></body></html>
