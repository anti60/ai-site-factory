<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cat Gallery</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet"><style> :root { --primary: #ff2d78; --secondary: #01cdfe; --accent: #fffb00; } body { margin: 0; font-family: 'DM Sans', sans-serif; color: #fff; background-color: #111; } header { display: flex; justify-content: space-between; align-items: center; padding: 30px; background: var(--primary); } nav { display: flex; gap: 20px; } nav a { color: white; text-decoration: none; transition: color 0.3s; } nav a:hover { color: var(--secondary); } .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; animation: fadeIn 2s; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } h1 { font-size: 3rem; margin: 0; } p { font-size: 1.2rem; } .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 20px; } .gallery img { width: 100%; border-radius: 15px; transition: transform 0.4s, box-shadow 0.4s; } .gallery img:hover { transform: scale(1.1); box-shadow: 0 4px 15px rgba(255, 45, 120, 0.5); } footer { text-align: center; padding: 30px; } .loading { font-size: 1.5rem; color: var(--accent); } .error { color: red; } @media (max-width: 768px) { h1 { font-size: 2rem; } p { font-size: 1rem; } .gallery { padding: 10px; } } </style></head><body><header><h1>Cat Gallery</h1><nav><a href="#">Home</a><a href="#">About</a><a href="#">Contact</a></nav></header><section class="hero"><h1>Welcome to the Cat Gallery!</h1><p>Explore a collection of beautiful cat images.</p></section><section class="gallery" id="gallery"></section><div id="loading" class="loading" style="display: none;">Loading images...</div><div id="error-message" class="error" style="display: none;"></div><footer><p>&copy; 2023 Cat Gallery. All rights reserved.</p></footer><script>async function fetchCatImages() { const gallery = document.getElementById('gallery'); const loading = document.getElementById('loading'); const errorMessage = document.getElementById('error-message'); loading.style.display = 'block'; try { const response = await fetch('https://api.thecatapi.com/v1/images/search?limit=10'); if (!response.ok) throw new Error('Network response was not ok'); const data = await response.json(); loading.style.display = 'none'; data.forEach(cat => { const img = document.createElement('img'); img.src = cat.url; img.alt = 'Cute Cat'; gallery.appendChild(img); }); } catch (error) { loading.style.display = 'none'; errorMessage.textContent = 'Failed to load cat images. Please try again later.'; errorMessage.style.display = 'block'; console.error('Fetch error:', error); } } fetchCatImages();</script><a href="https://ai-site-factory-green.vercel.app" id="__back_btn" style="position:fixed;bottom:20px;right:20px;z-index:99999;background:rgba(10,10,15,0.9);backdrop-filter:blur(10px);color:#58a6ff;border:1px solid rgba(88,166,255,0.4);padding:10px 18px;border-radius:50px;font-family:sans-serif;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 4px 20px rgba(0,0,0,0.5);">← AI Site Factory</a></body></html>
